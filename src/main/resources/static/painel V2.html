<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Painel de Atendimentos — Supre</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --accent:    #f97316;   /* era #3b82f6 (azul) → vira laranja */
      --bg:        #ffffff;   /* era #0f1117 (preto) → vira branco */
      --surface:   #fff7ed;   /* era #1a1d27 → fundo levemente alaranjado */
      --card:      #ffedd5;   /* era #21253a → card laranja claro */
      --border:    #fed7aa;   /* era #2e3348 → borda laranja suave */
      --text:      #1c1917;   /* era #e5e7eb → texto escuro */
      --subtext:   #78716c;   /* era #9ca3af → subtexto marrom */
      --muted:     #a8a29e;   /* era #6b7280 */
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* HEADER */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 28px;
      background: var(--accent);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .logo {
      font-size: 18px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.5px;
    }
    .header-right { display: flex; align-items: center; gap: 10px; }
    .badge-total {
      font-size: 12px;
      color: #fff;
      background: rgba(255,255,255,.2);
      padding: 4px 10px;
      border-radius: 999px;
    }
    .btn-refresh {
      background: #fff;
      color: var(--accent);
      border: none;
      padding: 7px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    /* VIEWS */
    #view-board { display: block; }
    #view-chat  { display: none; }

    /* BOARD */
    .board-wrapper { padding: 20px 16px; overflow-x: auto; }
    .board { display: flex; gap: 12px; min-width: max-content; align-items: flex-start; }

    .col {
      width: 250px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      flex-shrink: 0;
    }
    .col-header {
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      background: var(--card);
    }
    .col-label {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .5px;
      color: var(--text);
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .col-count {
      font-size: 11px;
      font-weight: 700;
      background: var(--accent);
      color: #fff;
      padding: 2px 7px;
      border-radius: 999px;
    }
    .col-body {
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 7px;
      min-height: 60px;
    }

    /* CARD */
    .card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 11px;
      cursor: pointer;
      transition: border-color .15s, box-shadow .15s;
    }
    .card:hover {
      border-color: var(--accent);
      box-shadow: 0 2px 8px rgba(249,115,22,.15);
    }
    .card-name { font-size: 13px; font-weight: 600; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-phone { font-size: 11px; color: var(--subtext); margin-bottom: 6px; font-family: monospace; }
    .card-msg { font-size: 12px; color: var(--subtext); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 7px; }
    .card-footer { display: flex; align-items: center; justify-content: space-between; }
    .card-time { font-size: 10px; color: var(--muted); }
    .btn-ver {
      font-size: 10px;
      padding: 3px 8px;
      border-radius: 4px;
      border: 1px solid var(--accent);
      background: transparent;
      color: var(--accent);
      cursor: pointer;
      font-weight: 600;
    }
    .col-empty { text-align: center; font-size: 12px; color: var(--muted); padding: 18px 8px; }
    .loading { text-align: center; color: var(--subtext); font-size: 14px; padding: 60px 0; }

    /* STATUS DOTS */
    .dot-novo      { background: var(--accent); }
    .dot-interesse { background: var(--yellow); }
    .dot-andamento { background: #f97316; }
    .dot-enviado   { background: var(--purple); }
    .dot-vendedor  { background: var(--red); }
    .dot-ganho     { background: var(--green); }
    .dot-sem       { background: var(--muted); }

    /* CHAT VIEW */
    .chat-container {
      display: flex;
      flex-direction: column;
      height: calc(100vh - 56px);
    }
    .chat-topbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .btn-back {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .chat-info { flex: 1; }
    .chat-info .name { font-size: 15px; font-weight: 700; }
    .chat-info .phone { font-size: 12px; color: var(--subtext); font-family: monospace; }
    .chat-status-wrap { display: flex; align-items: center; gap: 8px; }
    .chat-status-wrap label { font-size: 12px; font-weight: 600; color: var(--subtext); }
    .select-status {
      background: #fff;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      outline: none;
      cursor: pointer;
    }
    .btn-salvar-status {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    /* MENSAGENS */
    .msgs-area {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #fafaf9;
    }
    .msg-row { display: flex; }
    .msg-row.user  { justify-content: flex-start; }
    .msg-row.assistant { justify-content: flex-end; }

    .bubble {
      max-width: 65%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.5;
      position: relative;
    }
    .msg-row.user .bubble {
      background: #fff;
      border: 1px solid var(--border);
      border-bottom-left-radius: 3px;
      color: var(--text);
    }
    .msg-row.assistant .bubble {
      background: var(--accent);
      color: #fff;
      border-bottom-right-radius: 3px;
    }
    .bubble-time {
      display: block;
      font-size: 10px;
      margin-top: 5px;
      opacity: .65;
      text-align: right;
    }
    .bubble-role {
      font-size: 10px;
      font-weight: 700;
      margin-bottom: 3px;
      opacity: .7;
      text-transform: uppercase;
      letter-spacing: .4px;
    }
    .msgs-empty { text-align: center; color: var(--muted); font-size: 13px; padding: 40px; }
    .msgs-loading { text-align: center; color: var(--subtext); font-size: 13px; padding: 40px; }
  </style>
</head>
<body>

<header>
  <div class="logo">Supre IA — Atendimentos</div>
  <div class="header-right">
    <span class="badge-total" id="badge-total">Carregando...</span>
    <button class="btn-refresh" onclick="voltarBoard()">← Kanban</button>
    <button class="btn-refresh" onclick="carregar()">↻ Atualizar</button>
  </div>
</header>

<!-- BOARD -->
<div id="view-board">
  <div class="board-wrapper">
    <div class="board" id="board">
      <div class="loading">Carregando atendimentos...</div>
    </div>
  </div>
</div>

<!-- CHAT -->
<div id="view-chat">
  <div class="chat-container">
    <div class="chat-topbar">
      <button class="btn-back" onclick="voltarBoard()">← Voltar</button>
      <div class="chat-info">
        <div class="name" id="chat-nome">—</div>
        <div class="phone" id="chat-phone">—</div>
      </div>
      <div class="chat-status-wrap">
        <label>Status:</label>
        <select class="select-status" id="chat-status-select">
          <option value="NOVO_CONTATO">Novo Contato</option>
          <option value="INTERESSE_IDENTIFICADO">Interesse Identificado</option>
          <option value="ORCAMENTO_EM_ANDAMENTO">Orçamento em Andamento</option>
          <option value="ORCAMENTO_ENVIADO">Orçamento Enviado</option>
          <option value="AGUARDANDO_VENDEDOR">Aguardando Vendedor</option>
          <option value="FECHADO_GANHO">Fechado / Ganho</option>
          <option value="SEM_INTERESSE">Sem Interesse</option>
        </select>
        <button class="btn-salvar-status" onclick="salvarStatus()">Salvar</button>
      </div>
    </div>
    <div class="msgs-area" id="msgs-area">
      <div class="msgs-loading">Carregando conversa...</div>
    </div>
  </div>
</div>

<script>
  const API = '';
  let atendimentoAtual = null;

  const COLUNAS = [
    { status: 'NOVO_CONTATO',           label: 'Novo Contato',           dot: 'dot-novo' },
    { status: 'INTERESSE_IDENTIFICADO', label: 'Interesse Identificado', dot: 'dot-interesse' },
    { status: 'ORCAMENTO_EM_ANDAMENTO', label: 'Orçamento em Andamento', dot: 'dot-andamento' },
    { status: 'ORCAMENTO_ENVIADO',      label: 'Orçamento Enviado',      dot: 'dot-enviado' },
    { status: 'AGUARDANDO_VENDEDOR',    label: 'Aguardando Vendedor',    dot: 'dot-vendedor' },
    { status: 'FECHADO_GANHO',          label: 'Fechado / Ganho',        dot: 'dot-ganho' },
    { status: 'SEM_INTERESSE',          label: 'Sem Interesse',          dot: 'dot-sem' },
  ];

  function fmt(iso) {
    if (!iso) return '—';
    return new Date(iso).toLocaleString('pt-BR', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' });
  }

  function fmtPhone(p) {
    if (!p) return '—';
    const n = p.replace(/\D/g,'');
    if (n.length === 13) return `+${n.slice(0,2)} (${n.slice(2,4)}) ${n.slice(4,9)}-${n.slice(9)}`;
    return p;
  }

  async function carregar() {
    const board = document.getElementById('board');
    board.innerHTML = '<div class="loading">Carregando...</div>';
    try {
      const res = await fetch(`${API}/atendimentos`);
      const lista = await res.json();
      document.getElementById('badge-total').textContent = `${lista.length} atendimentos`;

      const grupos = {};
      COLUNAS.forEach(c => grupos[c.status] = []);
      lista.forEach(a => { if (grupos[a.status] !== undefined) grupos[a.status].push(a); });

      board.innerHTML = '';
      COLUNAS.forEach(col => {
        const items = grupos[col.status];
        const colEl = document.createElement('div');
        colEl.className = 'col';
        colEl.innerHTML = `
          <div class="col-header">
            <div class="col-label"><span class="dot ${col.dot}"></span>${col.label}</div>
            <span class="col-count">${items.length}</span>
          </div>
          <div class="col-body" id="col-${col.status}">
            ${items.length === 0 ? '<div class="col-empty">Nenhum</div>' : ''}
          </div>`;
        board.appendChild(colEl);

        const body = document.getElementById(`col-${col.status}`);
        items.forEach(a => {
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <div class="card-name">${a.nomeCliente || 'Sem nome'}</div>
            <div class="card-phone">${fmtPhone(a.phone)}</div>
            <div class="card-msg">${a.ultimaMensagem || '—'}</div>
            <div class="card-footer">
              <span class="card-time">${fmt(a.atualizadoEm)}</span>
              <button class="btn-ver" onclick="abrirChat('${a.id}')">Ver conversa</button>
            </div>`;
          body.appendChild(card);
        });
      });
    } catch(e) {
      board.innerHTML = '<div class="loading">Erro ao carregar. Verifique se o servidor está rodando.</div>';
    }
  }

  async function abrirChat(id) {
    document.getElementById('view-board').style.display = 'none';
    document.getElementById('view-chat').style.display = 'block';
    document.getElementById('msgs-area').innerHTML = '<div class="msgs-loading">Carregando conversa...</div>';

    try {
      const [resA, resM] = await Promise.all([
        fetch(`${API}/atendimentos/${id}`),
        fetch(`${API}/atendimentos/${id}/mensagens`)
      ]);
      const atendimento = await resA.json();
      const mensagens = await resM.json();

      atendimentoAtual = atendimento;
      document.getElementById('chat-nome').textContent = atendimento.nomeCliente || 'Sem nome';
      document.getElementById('chat-phone').textContent = fmtPhone(atendimento.phone);
      document.getElementById('chat-status-select').value = atendimento.status;

      const area = document.getElementById('msgs-area');
      if (!mensagens || mensagens.length === 0) {
        area.innerHTML = '<div class="msgs-empty">Nenhuma mensagem registrada.</div>';
        return;
      }

      area.innerHTML = '';
      mensagens.forEach(m => {
        const row = document.createElement('div');
        row.className = `msg-row ${m.role}`;
        const isIA = m.role === 'assistant';
        row.innerHTML = `
          <div class="bubble">
            <div class="bubble-role">${isIA ? '🤖 IA Supre' : '👤 Cliente'}</div>
            ${m.content}
            <span class="bubble-time">${fmt(m.data)}</span>
          </div>`;
        area.appendChild(row);
      });

      area.scrollTop = area.scrollHeight;
    } catch(e) {
      document.getElementById('msgs-area').innerHTML = '<div class="msgs-empty">Erro ao carregar mensagens.</div>';
    }
  }

  async function salvarStatus() {
    if (!atendimentoAtual) return;
    const novoStatus = document.getElementById('chat-status-select').value;
    try {
      await fetch(`${API}/atendimentos/${atendimentoAtual.id}/status?status=${novoStatus}`, { method: 'PUT' });
      atendimentoAtual.status = novoStatus;
      alert('Status atualizado!');
    } catch(e) {
      alert('Erro ao salvar status.');
    }
  }

  function voltarBoard() {
    document.getElementById('view-board').style.display = 'block';
    document.getElementById('view-chat').style.display = 'none';
    atendimentoAtual = null;
    carregar();
  }

  carregar();
  setInterval(() => {
    if (document.getElementById('view-board').style.display !== 'none') carregar();
  }, 30000);
</script>
</body>
</html>
